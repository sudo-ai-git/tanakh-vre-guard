[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanakh-vre-guard"
version = "1.0.0"
description = "Shared verification library for NEAR hackathon projects: 231-gate checksums, SemanticSpace, CausalMemory, DualStreamGematria, BijectiveVerifier"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "NEAR Hackathon 2026"}]
keywords = ["near", "verification", "gematria", "tanakh", "231-gate", "vre", "agent", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tanakh_vre_guard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]